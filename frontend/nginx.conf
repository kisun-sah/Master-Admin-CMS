# ==============================================================================
# KBR Digital — Production Nginx Configuration
# Architecture: Single Origin (Port 80/443), Two Isolated SPAs, Express Proxy
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name kbrdigital.com www.kbrdigital.com;

    # Redirect HTTP to HTTPS in production
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kbrdigital.com www.kbrdigital.com;

    # SSL Certificates (managed via Let's Encrypt / Certbot)
    # ssl_certificate /etc/letsencrypt/live/kbrdigital.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/kbrdigital.com/privkey.pem;

    root /var/www/kbr-digital/frontend/dist;
    index index.html;

    # --------------------------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --------------------------------------------------------------------------
    # Gzip Compression
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # 1. Admin CMS Application SPA Dispatch (/admin & /admin/*)
    # --------------------------------------------------------------------------
    location ^~ /admin {
        # Serve admin assets directly if found, otherwise fallback to admin.html
        try_files $uri $uri/ /admin.html;

        # Prevent browser caching of HTML entry
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # --------------------------------------------------------------------------
    # 2. Public Website SPA Dispatch (/)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # Prevent browser caching of HTML entry
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # --------------------------------------------------------------------------
    # 3. Static Assets (Vite Fingerprinted Hashes in /assets/*)
    # --------------------------------------------------------------------------
    location ~* ^/assets/.*\.(?:js|css|webp|png|jpe?g|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 4. Backend Reverse Proxies (Express API on Port 5000)
    # --------------------------------------------------------------------------
    # Dynamic REST API
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 50M;
    }

    # Uploaded Media Files (Images, Videos, Resumes)
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # SEO Dynamic XML & Robots
    location ~* ^/(sitemap\.xml|robots\.txt)$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
